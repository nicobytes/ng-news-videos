[project]
name = "my-video-workspace-tools"
version = "0.1.0"
description = "Python helpers for the HyperFrames workspace (audio analysis, transcripts)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "librosa>=0.10",
  "soundfile>=0.12",
  "yt-dlp>=2026.10.26",
  "opencv-python-headless<5",
  "faster-whisper>=1.2.1",
  "nvidia-cublas-cu12>=12.9.3.13",
  "nvidia-cudnn-cu12>=9.28.0.42",
  "av<19",
]

[dependency-groups]
# Local music generation (scripts/musicgen.py, and HyperFrames' own MusicGen fallback).
# On Linux the PyPI torch wheel ships with CUDA: no conda, no separate CUDA install.
# Light install without it: uv sync --no-group musicgen
musicgen = [
  "torch>=2.4",
  "transformers>=4.56",
]

[tool.uv]
package = false
default-groups = ["musicgen"]
